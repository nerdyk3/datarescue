name: Build installers

on:
  workflow_dispatch: {}
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            build: npm run dist:mac
          - os: windows-latest
            build: npm run dist:win
          - os: ubuntu-latest
            build: npm run dist:linux
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build installer (bundles adb + rebuilds native modules)
        run: ${{ matrix.build }}
        env:
          # No code-signing certs in CI — produce unsigned installers.
          CSC_IDENTITY_AUTO_DISCOVERY: false
          # NOTE: do NOT set GH_TOKEN here. electron-builder attaches it to its
          # helper-binary downloads (winCodeSign/nsis/electron), and the CDN
          # rejects the auth header with HTTP 403. The token is only needed for
          # publishing, which happens in the separate release job.

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: datarescue-${{ matrix.os }}
          if-no-files-found: ignore
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
